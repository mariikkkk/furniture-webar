<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Сборка табурета по метке</title>
  <style>
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: #111; }
    #camera-viewport { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; background: #111; }
    #camera { position: relative; width: 100%; height: 100%; overflow: hidden; isolation: isolate; }
    #camera video, #camera canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .top { position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); display: flex; align-items: start; gap: 8px; }
    #status { background: white; padding: 6px 8px; font-size: 14px; }
    body[data-tracking="true"] #status { display: none; }
    #camera-details { margin-left: auto; padding: 0 8px; background: white; max-width: 100%; }
    #camera-details summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; }
    .panel { position: fixed; bottom: 0; inset-inline: 0; max-height: 45dvh; overflow: auto; box-sizing: border-box; background: white; padding: 8px max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
    [hidden] { display: none !important; }
    #step-number { font-size: 13px; }
    #step-details summary { cursor: pointer; padding-bottom: 6px; }
    #step-title { font-size: 16px; }
    .controls { display: flex; flex-wrap: wrap; gap: 6px; }
    p { margin: 0 0 8px; }
    button, select, input { font: inherit; min-height: 44px; }
    select { max-width: 100%; }
    #marker-size { width: 72px; }
  </style>
</head>
<body>
  <div id="camera-viewport">
    <div id="camera" aria-label="Камера"></div>
  </div>
  <header class="top">
    <p id="status" role="status">Положите квадратную метку на поверхность и наведите на неё камеру.</p>
    <button id="start" type="button">Открыть камеру</button>
    <details id="camera-details" hidden>
      <summary>Камера</summary>
      <label id="camera-choice" hidden>Выбрать <select id="camera-device"></select></label>
      <p id="camera-info"></p>
      <p><label>Сторона чёрного квадрата, см <input id="marker-size" type="number" min="1" max="100" step="0.1" value="12" inputmode="decimal" required></label></p>
    </details>
  </header>
  <section class="panel" aria-label="Инструкция по сборке">
    <div id="instructions">
      <div aria-live="polite">
        <details id="step-details">
          <summary><span id="step-number"></span> · <strong id="step-title"></strong></summary>
          <p id="step-text"></p>
        </details>
        <p id="hardware" hidden>
          <strong id="hardware-code"></strong>
          <span id="hardware-text"></span>
        </p>
      </div>
      <div class="controls">
        <button id="back" type="button">Назад</button>
        <button id="replay" type="button">Повторить</button>
        <button id="next" type="button">Далее</button>
      </div>
    </div>
  </section>
  <script type="module" src="/src/marker-prototype.js"></script>
</body>
</html>
